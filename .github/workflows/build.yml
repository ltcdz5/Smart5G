name: Build & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read module version
        id: ver
        run: |
          VERSION=$(sed -n 's/^version=//p' module/module.prop | head -1)
          VERCODE=$(sed -n 's/^versionCode=//p' module/module.prop | head -1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "vercode=$VERCODE" >> "$GITHUB_OUTPUT"
          echo "模块版本: $VERSION ($VERCODE)"

      - name: Normalize line endings
        run: |
          find module -type f \( -name '*.sh' -o -name '*.prop' -o -name '*.md' \) -exec sed -i 's/\r$//' {} +
          chmod 755 module/service.sh module/webctl.sh module/bin/netmode.sh

      - name: Syntax check
        run: |
          for f in module/service.sh module/webctl.sh module/bin/netmode.sh; do
            echo "检查 $f"
            sh -n "$f"
          done

      - name: Sync update.json
        run: |
          V='${{ steps.ver.outputs.version }}'
          C='${{ steps.ver.outputs.vercode }}'
          python3 - <<'PY'
          import json, os
          v = os.environ['V']
          c = int(os.environ['C'])
          repo = os.environ['GITHUB_REPOSITORY']
          tag = 'v' + v.lstrip('v')
          with open('update.json') as f:
              d = json.load(f)
          d['version'] = v
          d['versionCode'] = c
          d['zipUrl'] = f'https://github.com/{repo}/releases/download/{tag}/smart5g-{v}.zip'
          with open('update.json','w') as f:
              json.dump(d, f, indent=2, ensure_ascii=False)
              f.write('\n')
          print(json.dumps(d, indent=2, ensure_ascii=False))
          PY
        env:
          V: ${{ steps.ver.outputs.version }}
          C: ${{ steps.ver.outputs.vercode }}

      - name: Commit update.json if changed
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if ! git diff --quiet update.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add update.json
            git commit -m 'chore: 同步 update.json 到 ${{ steps.ver.outputs.version }}'
            git push
          else
            echo 'update.json 无变化'
          fi

      - name: Build module zip
        run: |
          cd module
          zip -r "../smart5g-${{ steps.ver.outputs.version }}.zip" . -x '*.bak*' -x '*.git*' -x '*.zip'
          cd ..
          ls -lh smart5g-*.zip
          unzip -l smart5g-*.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: smart5g-${{ steps.ver.outputs.version }}
          path: smart5g-*.zip
          if-no-files-found: error

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: smart5g-*.zip
          generate_release_notes: true
